server:
  port: ${RUNNER_PORT:8085}

runner:
  # Supported modes: DOCKER_CONTAINER, RESTRICTED_LOCAL_SANDBOX, AUTO
  isolation-mode: ${RUNNER_ISOLATION_MODE:AUTO}
  docker-image: ${RUNNER_DOCKER_IMAGE:interview-simulator-sandbox:latest}
  compile-timeout-ms: ${RUNNER_COMPILE_TIMEOUT_MS:8000}
  execution-timeout-ms: ${RUNNER_EXECUTION_TIMEOUT_MS:5000}
  per-test-timeout-ms: ${RUNNER_PER_TEST_TIMEOUT_MS:2000}
  max-source-bytes: ${RUNNER_MAX_SOURCE_BYTES:65536}
  max-output-chars: ${RUNNER_MAX_OUTPUT_CHARS:16384}
  max-memory-mb: ${RUNNER_MAX_MEMORY_MB:128}
  shared-secret: ${RUNNER_SHARED_SECRET:internal-runner-secret-key-2026}
