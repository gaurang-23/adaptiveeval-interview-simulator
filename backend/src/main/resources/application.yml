server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    max-http-form-post-size: 10MB

spring:
  application:
    name: adaptive-interview-simulator
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: "jdbc:mysql://${DB_HOST}:${DB_PORT:4000}/${DB_NAME}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC&characterEncoding=UTF-8"
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}}
  security:
    jwt-secret: ${JWT_SECRET:AdaptiveTechnicalInterviewSimulatorSecretKey2026ProductionGradeSecurityTokenKey987654321}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  runner:
    url: ${RUNNER_SERVICE_URL:http://127.0.0.1:8085}
    shared-secret: ${RUNNER_SHARED_SECRET:internal-runner-secret-key-2026}
    timeout-ms: ${RUNNER_TIMEOUT_MS:10000}
  ai:
    provider: ${AI_PROVIDER:OPENAI_COMPATIBLE}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-ms: ${AI_TIMEOUT_MS:15000}
  resume:
    max-upload-bytes: ${RESUME_MAX_UPLOAD_BYTES:5242880}
    rubric:
      required-technical-skills-weight: 30
      relevant-experience-weight: 25
      projects-weight: 20
      role-qualifications-weight: 15
      evidence-of-impact-weight: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
